<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Show Me Love cover</title>
  <desc id="desc">A blue and violet abstract record cover for Show Me Love.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#a5f3fc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity=".42"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="190" fill="#67e8f9" opacity=".35" filter="url(#blur)"/>
  <circle cx="540" cy="520" r="230" fill="#c084fc" opacity=".34" filter="url(#blur)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <circle cx="320" cy="320" r="188" fill="#0f172a" opacity=".16" stroke="#ffffff" stroke-opacity=".34" stroke-width="5"/>
  <circle cx="320" cy="320" r="108" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="320" cy="320" r="18" fill="#ffffff" fill-opacity=".9"/>
  <text x="320" y="305" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="4">SHOW ME</text>
  <text x="320" y="352" text-anchor="middle" fill="#ffffff" fill-opacity=".82" font-family="Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="8">LOVE</text>
  <text x="320" y="560" text-anchor="middle" fill="#ffffff" fill-opacity=".72" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">WIZTHEMC</text>
</svg>
