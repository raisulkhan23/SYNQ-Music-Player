<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SYNQ">
  <!-- Matches the supplied app-icon reference: a flat indigo-to-violet tile
       with a soft periwinkle light in the upper-left, and three curved white
       strokes. Deliberately no white highlight hotspot and no pill bars. -->
  <defs>
    <linearGradient id="synqTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#443DDF"/>
      <stop offset="38%" stop-color="#5A2EEE"/>
      <stop offset="70%" stop-color="#9439FD"/>
      <stop offset="100%" stop-color="#C24BFF"/>
    </linearGradient>
    <radialGradient id="synqWash" cx="26%" cy="14%" r="62%">
      <stop offset="0%" stop-color="#CFD2FF" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#A5A6FF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#A5A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="synqBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF7FF"/>
      <stop offset="100%" stop-color="#EDE4FF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#synqTile)"/>
  <rect width="512" height="512" rx="118" fill="url(#synqWash)"/>
  <g id="synqGlyph" fill="none" stroke="url(#synqBar)" stroke-width="38" stroke-linecap="round" transform="rotate(-5 256 280)">
    <path d="M164 200 Q258 166 352 192"/>
    <path d="M150 280 Q258 244 366 270"/>
    <path d="M136 360 Q258 322 380 348"/>
  </g>
</svg>
