name: Deploy to GitHub Pages

on:
  push:
    branches: [main, restoration/stash-features]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build web app for Pages
        # A GitHub Pages *project* site is served from /<repo>/, so the build
        # base must be that prefix. The router basename and the `public/` asset
        # URLs both read it back from `import.meta.env.BASE_URL`, which keeps the
        # landing page, its nav and its download CTAs pointing at the real
        # location instead of the domain root.
        #
        # The prefix is taken from the repository running the workflow, not
        # hardcoded: this same file ships in both the canonical repo
        # (`synqmusic`) and the public mirror (`SYNQ-Music-Player`), and each one
        # is served under its own name. Repo names are case-sensitive in the
        # Pages path, so the exact `repository.name` is used.
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          # The client backend address, baked in at build time. Without it the
          # deployed site boots into its "running without the Convex backend"
          # state and every visitor sees a dead client that retries a
          # placeholder WebSocket host. This is the same public deployment the
          # packaged Android build pins (see release.yml), kept overridable by a
          # repository variable so the URL can move without a code change.
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://graceful-jaguar-949.convex.cloud' }}
        run: npm run build -- --base="$PAGES_BASE"
      # A history router needs the shell for deep links and refreshes; Pages
      # serves 404.html for unknown paths, so make it the same document.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
