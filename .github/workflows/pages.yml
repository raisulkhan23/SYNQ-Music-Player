name: Deploy to GitHub Pages

on:
  push:
    branches: [main, restoration/stash-features]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build web app for Pages
        # A GitHub Pages *project* site is served from /<repo>/, so the build
        # base must be that prefix. The router basename and the `public/` asset
        # URLs both read it back from `import.meta.env.BASE_URL`, which keeps the
        # landing page, its nav and its download CTAs pointing at the real
        # location instead of the domain root.
        run: npm run build -- --base=/synqmusic/
      # A history router needs the shell for deep links and refreshes; Pages
      # serves 404.html for unknown paths, so make it the same document.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
