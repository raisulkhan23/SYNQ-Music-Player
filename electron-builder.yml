appId: com.synq.desktop
productName: SYNQ
copyright: Copyright (c) 2026 SYNQ

# Artifacts go to desktop-dist/ so the Windows exes never mix with the renderer
# output in dist/ (which Capacitor copies wholesale into the APK assets) and so
# an installer can never be packaged INTO the app it installs. This has to live
# here rather than in package.json: electron-builder reads `build` from
# package.json in preference to this file, and an empty `build: {}` there used
# to silently override everything below it — which is how a build with the
# default Electron icon and the wrong product name got produced.
directories:
  output: desktop-dist

# The SYNQ icon, as a real multi-resolution ICO.
#
# This used to point at `public/logo.png` for every field, including the NSIS
# `installerIcon` / `uninstallerIcon`. Those two are ICO-only inputs, so the
# installer was built with a default/placeholder mark instead of the SYNQ one —
# the "generic pink folder" icon in the reports. A PNG also carries exactly one
# raster size, so Windows had to manufacture every other size itself and picked
# a blurry upscale for the shell views.
#
# `public/logo.ico` is generated from the same `public/logo.png` by
# `scripts/build-logo-ico-from-png.cjs` and carries 16/24/32/48/64/128/256
# (verified by `scripts/validate-on-disk-icon.cjs`, which fails if the Windows
# sizes are missing). The prebuild hook regenerates and validates it before the
# builder runs, so a stale or broken ICO can never be packaged again.
#
# The ICO entries are PNG-compressed on purpose. An earlier hand-rolled
# dependency-free encoder wrote DIB rows top-down while declaring a positive
# (bottom-up) `biHeight`, so Windows flipped every size and the shell showed a
# logo whose bars sat in the upper half — recognisably SYNQ, but wrong. PNG
# entries have no row-order convention to get wrong, so that class of bug is
# gone rather than merely shifted.
icon: public/logo.ico

# The Electron build uses the renderer (production Vite output) plus the main
# and preload scripts. The packaged app is NOT the dev server.
# Build into desktop-dist/ so the Windows exes never mix with the renderer
# output in dist/ (which Capacitor copies wholesale into the APK assets).
files:
  - dist
  - '!dist/win-unpacked/**'
  # `public/` is copied into `dist/` wholesale, which includes the Android APK
  # served from /downloads on the website. Shipping a 4 MB mobile installer
  # inside a desktop installer is dead weight, so it is excluded here — and
  # `appDownloads()` hides that button when the app runs from file://.
  - '!dist/downloads/**'
  - '!dist/*.exe'
  - '!dist/*.blockmap'
  - '!dist/latest.yml'
  - '!dist/builder-debug.yml'
  - '!desktop-dist/**'
  - electron/*.cjs
  - package.json
  - public/logo.png
  - public/logo.ico
  - '!**/.git'
  - '!**/.vscode'
  - '!**/node_modules/.cache'
  - '!**/node_modules/**/*.md'
  - '!**/node_modules/**/*.ts'
  - '!**/node_modules/**/*.map'
  - '!**/tests'
  - '!**/android'
  - '!**/.env*'
  - '!**/*.spec.ts'
  - '!**/*.test.ts'
  - '!**/*.test.js'
  - '!**/*.spec.js'
  - '!**/scripts'
  - '!**/convex.json'
  - '!**/.gitignore'
  - '!**/dist/**/*.map'
  - '!**/dist/**/.gitkeep'
  - '!electron-builder.yml'
  - '!**/HaloSearchDemo.tsx'

# Don't ship the whole development environment in the installer.
extraResources:
  - from: public/logo.png
    to: logo.png
  # The tray reads `log.*` next to process.resourcesPath (see electron/tray.cjs),
  # and only what is listed here actually lands there. logo.ico is the tray's
  # second candidate, so without this line that fallback could never resolve.
  - from: public/logo.ico
    to: logo.ico

asar: true


win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: public/logo.ico
  artifactName: "${productName}-${version}-${arch}.${ext}"

portable:
  artifactName: "${productName}-${version}-${arch}-Portable.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: public/logo.ico
  uninstallerIcon: public/logo.ico
  license: LICENSE.txt
  displayLanguageSelector: false
  include: null

# Electron + builder versions used for this packaging pass.
electronLanguages:
  - en
