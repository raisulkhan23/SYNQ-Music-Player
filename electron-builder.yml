# SYNQ desktop packaging.
#
# `npm run desktop:installer` produces a Windows installer in `desktop-dist/`.
# The build output (`dist/`) is produced by Vite first; electron-builder only
# wraps it, so the packaged app is the same code that the browser serves.
appId: com.synq.app
productName: SYNQ
copyright: SYNQ

directories:
  output: desktop-dist
  buildResources: build

# Only these ship. `node_modules` is deliberately excluded: the renderer is
# already bundled by Vite, and the main process has no runtime dependencies.
files:
  - electron/**
  - dist/**
  # Web downloads are served from the site, not bundled into the desktop app.
  - "!dist/installers/**"
  # electron-builder copies production dependencies by default. The main
  # process only requires Electron builtins and files from `electron/`, so that
  # copy added ~1500 deeply nested files (paths past the 244-character limit)
  # and made the uninstaller fail while renaming the old install during an
  # upgrade, which aborted updates with "Failed to uninstall old application
  # files".
  - "!node_modules/**"
  - package.json

asar: true

# The tray loads its icon from `process.resourcesPath/logo.png`; without this
# copy the packaged app has no logo in the notification area and silently
# disables close-to-tray. Keep using the same shipped mark as the web app.
extraResources:
  - from: public/logo.png
    to: logo.png

win:
  target:
    - target: nsis
      arch:
        - x64
  # Register the synq:// handler at install time, so the OAuth callback from
  # the browser resolves to the installed app from the very first launch.
  # (The shell also calls setAsDefaultProtocolClient at runtime; this is the
  # installer-level guarantee that the OS-routed return path exists.)
  protocols:
    - name: SYNQ
      schemes:
        - synq
  # `scripts/make-icon.mjs` builds this from the PNGs the web app ships, so the
  # installer, Start-menu shortcut and taskbar all use the same artwork.
  icon: build/icon.ico
  artifactName: SYNQ-Setup-${version}.${ext}
  # Skip only code signing, not resource editing: `signAndEditExecutable: false`
  # also skipped rcedit, which left SYNQ.exe with Electron's default icon and
  # Electron's 33.x version metadata — so the Start-menu/desktop shortcut and
  # Explorer's file properties showed the wrong mark and the wrong version.
  # `signExecutable: false` keeps the icon and version info embedded while still
  # producing an unsigned (as before) executable.
  signExecutable: false

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SYNQ
  # Keeps the app's own user data across upgrades.
  deleteAppDataOnUninstall: false
  # Overrides the uninstaller's move-into-$PLUGINSDIR step, which fails on deep
  # paths and blocks upgrades over an existing install. See scripts/installer.nsh.
  include: scripts/installer.nsh

# Desktop builds are not published from here. Update hosting and code signing
# are external requirements; see README "Desktop (Windows)".
publish: null
